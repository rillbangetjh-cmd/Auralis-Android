name: Build Android APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ekstrak ZIP dan Perbaiki Mesin Gradle
        run: |
          echo "Mengestrak file ZIP..."
          unzip -o *.zip
          
          # Cari folder utama proyek
          PROJECT_DIR=$(dirname "$(find . -name "build.gradle*" | head -n 1)")
          cd "$PROJECT_DIR"
          
          # Jika file gradlew tidak ada, buat secara otomatis
          if [ ! -f "gradlew" ]; then
            echo "File gradlew hilang, membuat gradlew baru otomatis..."
            gradle wrapper
          fi
          
          chmod +x gradlew
          echo "Mulai merakit APK..."
          ./gradlew assembleDebug

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-APK
          path: ./**/*.apk
