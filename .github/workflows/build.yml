name: Build Android APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cek File dan Ekstrak
        run: |
          echo "Mengecek daftar file yang ter-upload..."
          ls -la
          
          echo "Mengekstrak file ZIP..."
          unzip -q *.zip || { echo "GAGAL: File ZIP tidak ditemukan di repository!"; exit 1; }
          
          echo "Mencari file gradlew..."
          GRADLE_DIR=$(dirname "$(find . -name gradlew | head -n 1)")
          if [ -z "$GRADLE_DIR" ] || [ "$GRADLE_DIR" = "." ] && [ ! -f "gradlew" ]; then
            echo "GAGAL: File gradlew tidak ditemukan! Struktur ZIP salah."
            exit 1
          fi
          
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-APK
          path: ./**/*.apk
