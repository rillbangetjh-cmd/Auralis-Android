name: Build Android APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ekstrak ZIP dan Perbaiki Struktur Proyek
        run: |
          echo "Mengestrak file ZIP..."
          unzip -o *.zip
          
          # Cari lokasi folder utama tempat settings.gradle / settings.gradle.kts berada
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)
          
          if [ -z "$SETTINGS_FILE" ]; then
            echo "GAGAL: File settings.gradle tidak ditemukan! ZIP Anda mungkin rusak."
            exit 1
          fi
          
          ROOT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Folder utama proyek ditemukan di: $ROOT_DIR"
          cd "$ROOT_DIR"
          
          # Pasang gradle wrapper di root project
          gradle wrapper
          
          chmod +x gradlew
          echo "Mulai merakit APK..."
          ./gradlew assembleDebug --stacktrace

      - name: Upload Hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: Auralis-APK
          path: ./**/*.apk
          
